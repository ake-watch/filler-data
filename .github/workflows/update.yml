name: Update filler dataset

# Manual until one supervised run has been reviewed: on a fresh runner there is no .cache/, so the parity checks against the old dataset skip.
on:
  workflow_dispatch: {}

permissions:
  contents: write

# Only one run at a time -- the scraper is a single-threaded, rate-limited
# client against animefillerlist.com (Crawl-delay: 10) and must never race
# itself.
concurrency:
  group: filler-data-update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Full scrape respects Crawl-delay: 10 across ~356 shows -> ~1 hour.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Full scrape (respects animefillerlist.com Crawl-delay: 10)
        run: node scrape.js

      # scrape.js rewrites filler.json from scratch; without this every run drops the film ids.
      - name: Merge the films pass back in
        run: node merge.js

      - name: Test the dataset before committing it
        run: npm test

      - name: Commit filler.json if changed
        run: |
          if git diff --quiet -- filler.json; then
            echo "No changes to filler.json"
            exit 0
          fi
          git config user.name "ake-app"
          git config user.email "312243255+ake-app@users.noreply.github.com"
          git add filler.json
          git commit -m "chore: weekly filler dataset refresh"
          git push
